name: Polygon Arbitrage Cloud Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: arbitrage-runner
  cancel-in-progress: true

jobs:
  run-arbitrage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests eth-account

      - name: Jalankan Radar Arbitrase Polygon Real-Time
        env:
          SMART_CONTRACT_ADDRESS: ${{ secrets.SMART_CONTRACT_ADDRESS }}
          METAMASK_PRIVATE_KEY: ${{ secrets.METAMASK_PRIVATE_KEY }}
        run: |
          python -u realita_murni_tanpa_rekayasa.py

      - name: Oper Tongkat Estafet ke Sesi Baru (Instan ~30 Detik)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          echo "Memulai estafet sesi baru secara otomatis..."
          gh workflow run bot.yml --repo felixprogram4432/bot-arbitrase-polygon --ref main
