name: Polygon Arbitrage Cloud Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: arbitrage-runner
  cancel-in-progress: false

jobs:
  run-arbitrage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Jalankan Radar Arbitrase Polygon Real-Time
        run: |
          python -u realita_murni_tanpa_rekayasa.py

      - name: Oper Tongkat Estafet ke Sesi Baru (Instan ~30 Detik)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          echo "Memulai estafet sesi baru secara otomatis..."
          gh workflow run bot.yml --repo felixprogram4432/bot-arbitrase-polygon --ref main
